name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # LibreOffice lays out the Word file for the Word/PDF page-count parity test.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:rls
        env:
          RLS_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-validation-only
          NEXT_PUBLIC_CONTACT_EMAIL: ci@example.com
      - run: npx playwright install --with-deps chromium
      # Public pages can be checked without cloud keys or a local Auth/Storage stack.
      # Signed-in journeys still need a disposable Supabase stack and separate verification.
      - run: npm run test:e2e -- tests/e2e/foundation.spec.ts tests/e2e/a11y.spec.ts --grep 'landing page|demo|expired link|public pages'
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-validation-only
          NEXT_PUBLIC_CONTACT_EMAIL: ci@example.com
